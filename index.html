<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>MediaPipe Tasks 人像去背 (ImageSegmenter)</title>

    <style>
      :root {
        --bg: #0b1020;
        --fg: #e6edf3;
        --muted: #9fb0c0;
        --accent: #ffeb3b;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Noto Sans TC,
          Helvetica, Arial, sans-serif;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid #1c2535;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      header h1 {
        font-size: 16px;
        margin: 0;
      }
      main {
        --header-h: 49px;
        --status-h: 48px;
        display: grid;
        grid-template-columns: 260px 1fr;
        height: calc(100% - var(--header-h) - var(--status-h));
      }
      aside {
        border-right: 1px solid #1c2535;
        padding: 14px;
        overflow: auto;
      }
      .panel {
        margin-bottom: 18px;
      }
      .panel h3 {
        margin: 0 0 8px;
        font-size: 13px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 8px 0;
      }
      .row input[type="range"] {
        width: 140px;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
      }

      .stage {
        position: relative;
        background: #05070f;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      video.input_video {
        display: none;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .stage canvas {
        max-width: 100%;
        max-height: 100%;
        width: 100%;
        height: 100%;
        display: block;
      }
      .output_canvas {
        z-index: 10;
      }
      .mask_canvas {
        z-index: 11;
        pointer-events: none;
        mix-blend-mode: screen;
      }
      .bg_canvas {
        z-index: 0;
      }

      .toolbar {
        position: absolute;
        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom));
        z-index: 20;
        display: flex;
        gap: 8px;
      }
      .toolbar button {
        padding: 8px 12px;
        border-radius: 12px;
        border: 1px solid #243149;
        background: #11182a;
        color: var(--fg);
        cursor: pointer;
      }
      .toolbar button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .statusbar {
        padding: 10px env(safe-area-inset-right) 10px env(safe-area-inset-left);
        border-top: 1px solid #1c2535;
        display: flex;
        gap: 16px;
        align-items: center;
        min-height: var(--status-h);
      }
      .statusbar .pill {
        background: #152035;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid #22314d;
      }

      /* 月亮特效（簡單示意） */
      #moonEffect {
        position: absolute;
        inset: auto 16px calc(16px + env(safe-area-inset-bottom)) auto;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        box-shadow: 0 0 0 0 rgba(255, 255, 200, 0);
        background: radial-gradient(
          circle at 40% 40%,
          #fffad1,
          #f8e88b 60%,
          rgba(0, 0, 0, 0) 61%
        );
        opacity: 0;
        transform: scale(0.9);
        transition: 0.35s ease all;
        z-index: 30;
      }
      #moonEffect.active {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 24px 6px rgba(255, 255, 160, 0.35);
      }

      /* 載入提示 */
      .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(11, 16, 32, 0.9);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        backdrop-filter: blur(4px);
      }
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 235, 59, 0.3);
        border-top: 3px solid var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* 行動裝置 RWD */
      .menu-btn {
        display: none;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid #243149;
        background: #11182a;
        color: var(--fg);
      }
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(2px);
        z-index: 40;
      }

      @media (max-width: 900px) {
        .menu-btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
        }
        main {
          grid-template-columns: 1fr;
          height: auto;
        }
        .stage {
          height: calc(100svh - var(--header-h) - var(--status-h));
        }
        /* 側欄改為抽屜 */
        aside {
          position: fixed;
          left: 0;
          top: 0;
          bottom: 0;
          width: min(88vw, 340px);
          max-width: 94vw;
          z-index: 50;
          background: #0b1020;
          border-right: 1px solid #1c2535;
          transform: translateX(-100%);
          transition: transform 0.25s ease;
          padding: 16px;
          overscroll-behavior: contain;
        }
        body.panel-open aside {
          transform: translateX(0);
        }
        body.panel-open .scrim[hidden] {
          display: block;
        }
        .scrim[hidden] {
          display: none;
        }
        .row input[type="range"] {
          width: 52vw;
        }
        .toolbar button {
          padding: 10px 14px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>MediaPipe ver:1.3 (小月亮版本)</h1>
      <div class="header-actions">
        <button id="menuButton" class="menu-btn" aria-label="切換側欄">
          ☰
        </button>
        <span id="detectionStatus" class="hint">尚未啟動</span>
      </div>
    </header>

    <main>
      <aside>
        <div class="panel">
          <h3>啟動 / 鏡頭</h3>
          <div class="row">
            <button id="startButton">開始</button>
            <button id="stopButton" disabled>停止</button>
          </div>
          <div class="row">
            <button id="switchCamera" disabled>切換前/後鏡頭</button>
          </div>
          <div class="hint">若 GPU 不可用會自動回退至 CPU。</div>
        </div>

        <div class="panel">
          <h3>分割設定</h3>
          <div class="row">
            <label
              ><input type="checkbox" id="enableSegmentation" checked />
              啟用去背</label
            >
          </div>
          <div class="row">
            <label><input type="checkbox" id="showMask" /> 顯示蒙版預覽</label>
          </div>
          <div class="row">
            <label>邊緣羽化</label>
            <input
              type="range"
              id="edgeFeather"
              min="0"
              max="8"
              step="1"
              value="3"
            />
            <span id="edgeFeatherVal" class="hint">3 px</span>
          </div>
          <div class="row">
            <label>時間平滑</label>
            <input
              type="range"
              id="temporalSmooth"
              min="0"
              max="95"
              step="1"
              value="60"
            />
            <span id="temporalSmoothVal" class="hint">0.60</span>
          </div>
          <div class="row">
            <label>閾值</label>
            <input
              type="range"
              id="threshold"
              min="0"
              max="100"
              step="1"
              value="38"
            />
            <span id="thresholdVal" class="hint">0.38</span>
          </div>
        </div>

        <div class="panel">
          <h3>背景</h3>
          <div class="row">
            <select id="backgroundSelect">
              <option value="original">原始</option>
              <option value="waves">波紋</option>
              <option value="frequency">頻率條</option>
              <option value="video" selected>影片（MP4/WebM）</option>
              <option value="gif">GIF 動畫融合</option>
              <option value="moon_video">月相影片 🌙</option>
            </select>
          </div>
          <div class="row">
            <span class="hint"
              >背景來源：MP4 影片 / GIF 動畫（1.gif）/
              月相影片（8秒動態錄製）</span
            >
          </div>
          <div class="row" id="gifBlendOptions" style="display: none">
            <label>GIF 融合模式:</label>
            <select id="gifBlendMode">
              <option value="overlay">疊加</option>
              <option value="multiply">相乘</option>
              <option value="screen">濾色</option>
              <option value="color-dodge">顏色加亮</option>
              <option value="difference">差異</option>
            </select>
          </div>
          <div class="row" id="gifOutputOptions" style="display: none">
            <label
              ><input type="checkbox" id="generateGif" checked />
              生成動畫影片</label
            >
          </div>
          <div class="row" id="gifGenerationSettings" style="display: none">
            <span class="hint"
              >錄製 3 秒高畫質動畫 (20fps, GIF 播放3次) 為影片檔案</span
            >
          </div>

          <!-- 月相影片格式選擇 -->
          <div class="row" id="moonVideoOptions" style="display: none">
            <label>影片格式:</label>
            <div style="display: flex; gap: 12px; align-items: center">
              <label style="display: flex; align-items: center; gap: 4px">
                <input type="radio" name="videoFormat" value="mp4" checked />
                MP4 (推薦)
              </label>
              <label style="display: flex; align-items: center; gap: 4px">
                <input type="radio" name="videoFormat" value="webm" />
                WebM
              </label>
            </div>
          </div>
          <div class="row" id="moonVideoSettings" style="display: none">
            <span class="hint">
              MP4：相容性佳，檔案較大｜WebM：檔案較小，部分裝置不支援
            </span>
          </div>
          <div class="row">
            <label>特效強度</label>
            <input
              type="range"
              id="effectIntensity"
              min="0"
              max="100"
              value="50"
            />
            <span id="intensityValue" class="hint">50%</span>
          </div>
        </div>

        <div class="panel">
          <h3>統計</h3>
          <div class="row">
            <span class="hint">偵測人臉：</span
            ><span class="pill" id="faceCount">0</span>
          </div>
          <div class="row">
            <span class="hint">區域內人臉：</span
            ><span class="pill" id="facesInArea">0</span>
          </div>
        </div>

        <div class="panel">
          <h3>快捷鍵</h3>
          <div class="hint">空白鍵：開始/停止 · C：切換鏡頭 · P：拍照</div>
        </div>
      </aside>

      <section class="stage">
        <video class="input_video" id="video" playsinline></video>

        <!-- 影片背景來源（已寫死，可換成你自己的 mp4/webm） -->
        <video
          id="bgVideo"
          class="bg_video"
          playsinline
          muted
          loop
          preload="auto"
          style="display: none"
          src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
        ></video>

        <!-- GIF 背景來源 -->
        <img
          id="bgGif"
          class="bg_gif"
          style="display: none"
          src="./1.gif"
          alt="GIF 背景"
        />

        <!-- 影片背景來源 (月相) -->
        <video
          id="bgMoonVideo"
          class="bg_video"
          style="display: none"
          muted
          loop
          preload="none"
          alt="影片背景"
        >
          <source src="./m30.webm" type="video/webm" />
          您的瀏覽器不支援影片播放
        </video>

        <canvas class="bg_canvas" id="bgCanvas"></canvas>
        <canvas class="mask_canvas" id="maskCanvas"></canvas>
        <canvas class="output_canvas" id="outputCanvas"></canvas>

        <div id="moonEffect"></div>
        <div class="toolbar">
          <button id="capturePhoto">📸 拍照</button>
          <button id="toggleMask">切換蒙版</button>
        </div>
      </section>
    </main>
    <div class="scrim" id="scrim" hidden></div>

    <div class="statusbar">
      <span>狀態：<strong id="statusText">Idle</strong></span>
      <span>模式：<span class="pill" id="modePill">VIDEO</span></span>
    </div>

    <!-- 移除了有問題的 gif.js，改用生成多張動畫幀的方式 -->

    <!-- 僅載入 UI 綁定模組；核心由它 import -->
    <script type="module" src="./uiController.js"></script>
  </body>
</html>
